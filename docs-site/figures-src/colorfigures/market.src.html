<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Market escrow</title><style>html body div#toast{top:5%!important;bottom:auto!important}</style></head><body>
<script src="core.js"></script>
<script src="snacc-fig.js"></script>
<script>
/* MARKET ESCROW: the testnet marketplace as a display case. TESTNET ONLY: testnet NEAR and testnet $SNACC have no monetary value.
   Checked against contracts/market/src/lib.rs and README (snacc-market, EN-126).
   - list: the owner calls the Snacc contract's nft_transfer_call(receiver_id = market, token_id, msg = {"price":"<yoctoNEAR>"}) with 1 yoctoNEAR.
     The Snacc contract calls nft_on_transfer on the market; a valid listing keeps the token in escrow (returns false), an invalid one returns true
     and the token goes back. Price must be > 0 and <= 10,000 NEAR (MAX_PRICE_YOCTO); <= 20 listings per seller; <= 1,000 listings in total.
   - buy(token_id): deposit >= price; the listing is removed first, the token is sent to the buyer, and only then the seller is paid price
     (the excess is refunded). Errors: ERR_LISTING_NOT_FOUND, ERR_SELLER_CANNOT_BUY, ERR_INSUFFICIENT_DEPOSIT.
   - delist(token_id): seller only, exactly 1 yoctoNEAR (ERR_YOCTO_REQUIRED, ERR_NOT_SELLER); the token goes back to the seller.
   - fee 0%; no admin withdrawal of listed tokens; the owner can only pause NEW listings.
   PARTS. Seller plinth and purse, buyer plinth and purse, the glass case with pedestal, escrow lock, price slate and a TESTNET ONLY plaque.
   See-through: the ledger slate (get_listing), the bolt that holds the token, and the port that nft_on_transfer opens. */

const PRICES = [1, 2, 5];
const SELLER = [25, 150], CASE = [30, 90], BUYER = [25, 30];
const POS = [[SELLER[0], SELLER[1], 14], [CASE[0], CASE[1], 20], [BUYER[0], BUYER[1], 14]];
const fresh = () => ({ where: 0, price: 1, sellerN: 0, buyerN: 5, fx: 1, kind: '', from: 0, to: 0, listed: false, coin: 0 });
let ui, mBusy = false;
const say = (t, ms = 4200) => ui.flash(t, ms);
const near = n => `${n} NEAR`;
const arc = (a, b, t, h) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t + Math.sin(Math.PI * t) * h];

function mLoop() {
  if (mBusy) return; mBusy = true; let last = performance.now();
  ui.animate(() => { const st = ui.st, now = performance.now(), dt = Math.min(.05, (now - last) / 1000); last = now; let busy = false;
    if (st.fx < 1) { st.fx = Math.min(1, st.fx + dt / (sfMs(st.kind === 'buy' ? 3000 : 1700) / 1000)); busy = true; if (st.fx >= 1) { st.sellerN = st.sn2 ?? st.sellerN; st.buyerN = st.bn2 ?? st.buyerN; } }
    if (!busy) mBusy = false; return busy; });
}
function mGo(st, kind, to, msg) { st.kind = kind; st.from = st.where; st.to = to; st.where = to; st.fx = 0; mLoop(); say(msg, 5200); }
function mList(st) {
  if (st.fx < 1) return say('One call at a time.');
  if (st.listed) return say('Refused: the Snacc is already in escrow. A second nft_transfer_call would fail: the owner is now the market (ERR_NOT_OWNER on the Snacc contract).');
  if (st.where !== 0) return say('Refused: only the owner can list. The buyer holds it now: use Reset.');
  st.listed = true; st.sn2 = st.sellerN; st.bn2 = st.buyerN;
  mGo(st, 'list', 1, `list: nft_transfer_call(market, token_id, {"price":"${st.price}e24"}) with 1 yoctoNEAR. The market's nft_on_transfer returns false, so the token stays in escrow. Price ${near(st.price)}.`);
}
function mBuy(st) {
  if (st.fx < 1) return say('One call at a time.');
  if (!st.listed) return say('Refused: ERR_LISTING_NOT_FOUND. Nothing is listed, so there is nothing to buy.');
  if (st.buyerN < st.price) return say('Refused: ERR_INSUFFICIENT_DEPOSIT. The buyer attaches less than the price.');
  st.listed = false; st.sn2 = st.sellerN + st.price; st.bn2 = st.buyerN - st.price;
  mGo(st, 'buy', 2, `buy: deposit ${near(st.price)} attached. The listing is removed, the Snacc goes to the buyer, and only then the seller is paid ${near(st.price)} (0% fee, excess refunded).`);
}
function mDelist(st) {
  if (st.fx < 1) return say('One call at a time.');
  if (!st.listed) return say('Refused: ERR_LISTING_NOT_FOUND. Only a listed token can be delisted.');
  st.listed = false; st.sn2 = st.sellerN; st.bn2 = st.buyerN;
  mGo(st, 'delist', 0, 'delist: the seller attaches exactly 1 yoctoNEAR. The listing is removed and the Snacc goes back to the seller.');
}

function mSnacc(p, role) {
  const r = 7, C = [p[0], p[1], p[2] + r * .85], R = sfRings(C, [r, r, r * .85], 6, 14), tint = SFC.amber;
  let s = sfSkin(R, tint, tone) + hullInk(sfPts(R), 2);
  if (vis([1, 0, 0])) for (const sg of [-1, 1]) s += sfBall([C[0] + r * .8, C[1] + sg * r * .38, C[2] + r * .3], r * .19, matOf('#fffdf4'), .6, toneI, 4, 8) + sfBall([C[0] + r * .93, C[1] + sg * r * .38, C[2] + r * .28], r * .09, matOf(INK), .3, toneI, 3, 6);
  return { box: [[C[0] - r, C[1] - r, p[2]], [C[0] + r, C[1] + r, p[2] + 2 * r * .85]], svg: s };
}
function mPurse(x, y, n) {
  let s = sfBall([x, y, 8.2], [4.5, 4.5, 3.6], matOf('#c9a46a'), 1.2, toneI, 5, 10);
  for (let i = 0; i < Math.min(6, Math.round(n)); i++) s += sfToken(x, y + 8, 4 + i * 1.3, 3.2, SFC.amber, 18, 1.1);
  return { box: [[x - 5, y - 5, 4], [x + 5, y + 12, 12 + 8]], svg: s };
}

function mScene(st, m) {
  const k = ease(st.xr || 0), parts = [], fx = st.fx;
  const floor = board(0, 0, 66, 182, 4, 6, SF_BOARD) + castShadow([[8, 20, 14], [42, 50, 14], [8, 170, 14], [42, 200, 14], [52, 140, 74], [14, 80, 74]], 4, boardTop(0, 0, 66, 182, 4, 6));
  // plinths with a name plate
  const plinth = (y, name) => ({ box: [[8, y - 17, 4], [42, y + 17, 14]], svg: box(8, y - 17, 4, 42, y + 17, 14, SFC.cream, toneI, 1.3) + (vis([1, 0, 0]) ? tx(42.2, y, 8, name, 3.1, INK, 800) : '') });
  parts.push(plinth(SELLER[1], 'seller.testnet'), plinth(BUYER[1], 'buyer.testnet'));
  const sN = fx < 1 && st.kind === 'buy' && fx > .65 ? st.sellerN : (fx >= 1 ? st.sellerN : st.sellerN), bN = st.buyerN;
  parts.push(mPurse(52, SELLER[1] + 2, st.sellerN + (fx < 1 && st.kind === 'buy' && fx > .93 ? st.price : 0)), mPurse(52, BUYER[1] + 2, st.buyerN - (fx < 1 && st.kind === 'buy' && fx > .02 ? st.price : 0)));
  // the case: base, pedestal, token slot, lock, plaque, slate
  const cx0 = 8, cx1 = 52, cy0 = CASE[1] - 30, cy1 = CASE[1] + 30, cz1 = 56;
  parts.push({ box: [[cx0, cy0, 4], [cx1, cy1, 14]], svg: box(cx0, cy0, 4, cx1, cy1, 14, SFC.cream, toneI, 1.4) });
  parts.push({ box: [[20, CASE[1] - 12, 14], [40, CASE[1] + 12, 18]], svg: cyl(CASE[0], CASE[1], 14, 18, 12, SFC.amber, toneI, 1.2, 20) });
  // the Snacc where it is now (in the case when listed), flying along an arc during a move
  let sn;
  if (fx < 1 && st.kind !== 'buy') { const t = ease(fx), p = arc(POS[st.from], POS[st.to], t, 26); sn = mSnacc(p); }
  else if (fx < 1 && st.kind === 'buy') { const t = ease(sfClamp((fx - .35) / .3, 0, 1)), p = fx < .35 ? POS[1] : arc(POS[1], POS[2], t, 26); sn = mSnacc(p); }
  else sn = mSnacc(POS[st.where]);
  parts.push(sn);
  // escrow lock on the case front, green when the token is held
  const held = st.where === 1 && fx >= 1 || (fx < 1 && st.kind === 'list' && fx > .6) || (fx < 1 && st.kind === 'buy' && fx < .35);
  parts.push({ box: [[cx1, CASE[1] - 5, 22], [cx1 + 3, CASE[1] + 5, 36]], svg: box(cx1, CASE[1] - 4.5, 20, cx1 + 2.4, CASE[1] + 4.5, 28, matOf(held ? '#7bbd8c' : '#c6ccce'), toneI, 1.1) + sfBall([cx1 + 2.8, CASE[1], 33], 3, SFC.steel, .9, toneI, 4, 8) + sfBall([cx1 + 2.8, CASE[1], 24], 1.2, matOf(held ? SF_GREEN : '#a39a82'), .5, toneI, 3, 6) });
  // plaque + slate
  parts.push({ box: [[cx0 + 2, CASE[1] - 22, cz1], [cx1 - 2, CASE[1] + 22, cz1 + 3]], svg: box(cx0 + 2, CASE[1] - 22, cz1, cx1 - 2, CASE[1] + 22, cz1 + 5, matOf('#f8aa06'), toneI, 1.4) + (vis([1, 0, 0]) ? tx(cx1 - 1.8, CASE[1], cz1 + 1.3, 'TESTNET ONLY', 3.3, INK, 800) : '') });
  const slateOn = st.listed || (fx < 1 && st.kind === 'list');
  parts.push({ box: [[cx0 + 1, CASE[1] - 16, 36], [cx0 + 3, CASE[1] + 16, 56]], svg: box(cx0 + 1, CASE[1] - 16, 36, cx0 + 3, CASE[1] + 16, 56, matOf(slateOn ? '#2f3b34' : '#6b6558'), toneI, 1.2) + (slateOn && vis([1, 0, 0]) ? tx(cx0 + 3.2, CASE[1], 50, 'price', 3.4, '#8af0ae', 800) + tx(cx0 + 3.2, CASE[1], 43, near(st.price), 3.6, '#8af0ae', 800) : '') });
  // see-through innards: the bolt that holds the token, and the open port while listing
  let mech = '';
  if (k > 0) mech = `<g opacity="${f(k)}">${cyl(CASE[0] - 3, CASE[1] - 12 + (held ? 4 : 0), 18, 24, 1.6, SFC.steel, toneI, .8, 10)}${cyl(CASE[0] - 3, CASE[1] + 12 - (held ? 4 : 0), 18, 24, 1.6, SFC.steel, toneI, .8, 10)}${box(cx1 - 1, CASE[1] + 14, 38, cx1 + 1, CASE[1] + 28, 54, matOf(fx < .6 && st.kind === 'list' ? '#f8aa06' : '#c6ccce'), toneI, .9)}</g>`;
  const glass = (a, b) => `<g opacity="${f(.16 - .12 * k)}">${box(cx0 + .5, cy0 + .5, 14, cx1 - .5, cy1 - .5, cz1, SFC.glass, toneI, .8)}</g>` + `<g opacity="${f(.85 - .5 * k)}">${hullInk([[cx0, cy0, 14], [cx1, cy0, 14], [cx0, cy1, 14], [cx1, cy1, 14], [cx0, cy0, cz1], [cx1, cy0, cz1], [cx0, cy1, cz1], [cx1, cy1, cz1]], 1.8)}</g>`;
  parts.push({ box: [[cx0, cy0, 14], [cx1, cy1, cz1]], svg: glass() });
  // coins: deposit into the case, then the payout to the seller (buy)
  if (st.kind === 'buy' && fx < 1) {
    if (fx < .3) { const t = ease(fx / .3), p = arc([52, BUYER[1] + 10, 6], [30, CASE[1] - 22, 26], t, 22); parts.push({ box: [[p[0] - 4, p[1] - 4, p[2] - 1], [p[0] + 4, p[1] + 4, p[2] + 3]], svg: sfToken(p[0], p[1], p[2], 3.2, SFC.amber, 18, 1.2) }); }
    if (fx > .65) { const t = ease((fx - .65) / .35), p = arc([30, CASE[1] + 22, 26], [52, SELLER[1] + 10, 6], t, 22); parts.push({ box: [[p[0] - 4, p[1] - 4, p[2] - 1], [p[0] + 4, p[1] + 4, p[2] + 3]], svg: sfToken(p[0], p[1], p[2], 3.2, SFC.amber, 18, 1.2) }); } }
  const tags = k > .6 ? xrCallouts([{ at: [cx0 + 3, CASE[1], 50], text: 'LEDGER', on: st.listed }, { at: [CASE[0] - 3, CASE[1] - 8, 22], text: 'BOLT', on: held }, { at: [cx1, CASE[1] + 20, 46], text: 'PORT', on: fx < .6 && st.kind === 'list' },
    { at: [CASE[0], CASE[1], 18], text: 'ESCROW', on: held }, { at: [cx1 + 2, CASE[1], 33], text: 'LOCK', on: held }], [0, 66, 0, 182, 0, 80])
    : tag([cx1, CASE[1] + 18, 60], 30, -22, 'TESTNET ONLY', false) + tag([cx1 + 2.8, CASE[1], 30], 36, 6, 'LOCK', held) + tag([25, SELLER[1], 30], 30, -18, 'SELLER', st.kind === 'list' && fx < 1) + tag([25, BUYER[1], 30], 30, -18, 'BUYER', st.kind === 'buy' && fx < 1);
  return floor + byDepth(parts) + mech + tags;
}

ui = mountFigure({
  fig: '05', turn: 'full', title: 'Market escrow (testnet only)', credit: false,
  size: [66, 182, 64], center: [33, 91], palette: 'snacc',
  state: fresh(),
  scene: mScene,
  stats: st => [{ label: 'Listing (testnet only)', value: st.listed ? `${near(st.price)}, in escrow` : 'none', small: true },
    { label: 'Owner', value: st.listed ? 'market (escrow)' : st.where === 2 ? 'buyer.testnet' : 'seller.testnet', small: true },
    { label: 'Seller / buyer (NEAR)', value: `${st.sellerN + (st.kind === 'buy' && st.fx < 1 && st.fx > .93 ? st.price : 0)} / ${st.buyerN - (st.kind === 'buy' && st.fx < 1 ? st.price : 0)}`, small: true }],
  buttons: [
    { label: 'List', onClick: st => mList(st) },
    { label: 'Buy', onClick: st => mBuy(st) },
    { label: 'Delist', onClick: st => mDelist(st) },
    { label: 'Price', choices: st => PRICES.map(v => ({ label: near(v), current: st.price === v, disabled: st.listed, why: 'The price is set when listing. Delist first.', onClick: s => { s.price = v; say(`Price ${near(v)} (msg price in yoctoNEAR, max 10,000 NEAR).`, 2600); } })) },
    { label: 'Reset', onClick: st => { Object.assign(st, fresh()); say('Reset: the seller owns the Snacc again.', 2200); mLoop(); } },
  ],
  params: (st, q) => { if (q.get('listed') === '1') { st.listed = true; st.where = 1; } if (q.get('bought') === '1') { st.where = 2; st.sellerN = 1; st.buyerN = 4; } },
});
xrMount(() => ui, () => '');
sfPrimary('List');
sfCenter(ui);
</script></body></html>
