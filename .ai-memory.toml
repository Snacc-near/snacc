# ai-memory scope pin — Snacc (project 2).
# Semua sesi di subtree ini tercatat di workspace/project "snacc".
workspace = "snacc"
project = "snacc"

[capture]
# Jangan pernah capture material secret (aturan project: .env & .secrets/).
ignore_paths = [
  ".secrets/**",
  "**/.secrets/**",
  ".env",
  ".env.*",
  "**/.env",
  "**/.env.*",
]

[briefing]
# Brief otomatis tiap sesi: berisi "Snacc — Peta Vault Ringkas" (peta lengkap
# 84 dokumen vault) + judul halaman terbaru. Budget ~2.400 token (pas di batas
# inline context Claude Code 9.800 char, jadi tidak pernah dibuang ke file).
inject_on_session_start = "true"
max_chars = 9500

