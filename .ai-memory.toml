# ai-memory scope pin — Snacc (project 2).
# All sessions under this subtree are recorded in workspace/project "snacc".
workspace = "snacc"
project = "snacc"

[capture]
# Never capture secret material (project rule: .env & .secrets/).
ignore_paths = [
  ".secrets/**",
  "**/.secrets/**",
  ".env",
  ".env.*",
  "**/.env",
  "**/.env.*",
]

[briefing]
# Automatic briefing every session: contains "Snacc — Peta Vault Ringkas" (the full map
# of the 84 vault documents) + the latest page titles. Budget ~2,400 tokens (fits the
# inline Claude Code context of 9,800 chars, so it is never spilled to a file).
inject_on_session_start = "true"
max_chars = 9500

