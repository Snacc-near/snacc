name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch the scripts repo at the commit the gitlink points to
        run: |
          SHA=$(git ls-tree HEAD scripts | awk '{print $3}')
          rm -rf scripts
          git clone -q https://github.com/Snacc-near/scripts.git scripts
          git -C scripts checkout -q "$SHA"
      - name: "check:claims + check-links (OPS-115 / DK-085)"
        run: |
          npm run check:claims
          npm run check-links
  docs-site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v4
      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Install, build and type-check the docs site
        run: |
          npm ci
          npm run build
          npm run types:check
