name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: "check:claims + check-links (OPS-115 / DK-085)"
        run: |
          npm run check:claims
          npm run check-links
